query chatMessagesConnection(
  $where: ChatMessageWhereInput
  $orderBy: [ChatMessageOrderByWithRelationInput!]
  $skip: Int
  # $after: String
  # $before: String
  $first: Int = 10 # $last: Int
) {
  chatMessagesCount(where: $where)

  chatMessages(
    where: $where
    orderBy: $orderBy
    skip: $skip
    # after: $after
    # before: $before
    take: $first # last: $last
  ) {
    ...ChatMessage_
  }
}

query chatMessage($where: ChatMessageWhereUniqueInput!) {
  object: chatMessage(where: $where) {
    ...ChatMessage_
  }
}

fragment ChatMessage_ on ChatMessage {
  ...ChatMessageNoNesting
  Room {
    ...ChatRoomNoNesting
  }
  CreatedBy {
    ...UserNoNesting
  }
}

fragment ChatMessageNoNesting on ChatMessage {
  id
  createdAt
  updatedAt
  content
  contentText
}

mutation createChatMessageProcessor($data: ChatMessageCreateInput!) {
  response: createChatMessageProcessor(data: $data) {
    ...ChatMessageResponse_
  }
}

fragment ChatMessageResponse_ on ChatMessageResponse {
  success
  message
  errors {
    key
    message
  }
  data {
    ...ChatMessage_
  }
  reply {
    ...ChatMessage_
  }
}
