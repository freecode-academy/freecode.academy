query chatMessageOldsConnection(
  $where: ChatMessageOldWhereInput
  $orderBy: [ChatMessageOldOrderByWithRelationInput!]
  $skip: Int
  # $after: String
  # $before: String
  $first: Int = 10 # $last: Int
) {
  chatMessageOldsCount(where: $where)

  chatMessageOlds(
    where: $where
    orderBy: $orderBy
    skip: $skip
    # after: $after
    # before: $before
    take: $first # last: $last
  ) {
    ...ChatMessageOld_
  }
}

query chatMessageOld($where: ChatMessageOldWhereUniqueInput!) {
  object: chatMessageOld(where: $where) {
    ...ChatMessageOld_
  }
}

