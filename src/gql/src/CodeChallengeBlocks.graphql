fragment codeChallengeBlocksBlock on CodeChallengeBlock {
  ...challengeBlockNoNesting
  Challenges {
    ...challenge
  }
  Children {
    ...challengeBlockNoNesting
    Challenges {
      ...challenge
    }
  }
}

fragment challengeBlockNoNesting on CodeChallengeBlock {
  id
  # externalKey
  # createdAt
  # updatedAt
  name
  # rank
}

fragment challenge on CodeChallenge {
  id
  name
  localeTitle
  # externalKey
  # createdAt
  # updatedAt
  # description
  # challengeType
  # instructions
  # order
  # superOrder
  # challengeOrder
  # required
  # Нет смысла сейчас использовать, слишком мало записей
  # isRequired

  # isPrivate
  # isBeta
  # time
  # rank
}
