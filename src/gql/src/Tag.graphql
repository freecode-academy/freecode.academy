query tag($where: TagWhereUniqueInput!) {
  object: tag(where: $where) {
    ...tag_
  }
}

query tagsConnection(
  $first: Int!
  $skip: Int
  $where: TagWhereInput
  $orderBy: [TagOrderByWithRelationInput!]
) {
  tagsCount(where: $where)
  tags(take: $first, skip: $skip, where: $where, orderBy: $orderBy) {
    ...tag_
  }
}

fragment tag_ on Tag {
  id
  name
  Resources {
    id
    Resource: ResourceTagResource {
      id
      type
      name
      uri
    }
  }
  CreatedBy: CreatedByUser {
    ...UserNoNesting
  }
}
