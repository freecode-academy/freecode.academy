query tasksConnection(
  $where: TaskWhereInput
  $orderBy: [TaskOrderByWithRelationInput!] = { createdAt: desc }
  $skip: Int
  # $after: String
  # $before: String
  $first: Int = 10
  # $last: Int
  $timersWhere: TimerWhereInput
) {
  tasksCount(where: $where)

  tasks(
    where: $where
    orderBy: $orderBy
    skip: $skip
    # after: $after
    # before: $before
    take: $first # last: $last
  ) {
    ...tasksConnectionTask
  }
}

query task($where: TaskWhereUniqueInput!, $timersWhere: TimerWhereInput) {
  object: task(where: $where) {
    ...task_
    # Timers(orderBy: { createdAt: desc }, where: $timersWhere) {
    #   ...timersConnectionTimer
    # }
    CodeChallengeCompletion {
      id
      CodeChallenge: CodeChallengeCompletionCodeChallenge {
        ...codeChallengeWithBlocks_
      }
    }
    ...taskTaskTechnologies
    Comments(orderBy: { createdAt: asc }) {
      ...ResourceNoNesting
      CreatedBy {
        ...UserNoNesting
      }
    }
  }
}

query officeTasks(
  $orderBy: [TaskOrderByWithRelationInput!]
  $where: TaskWhereInput
) {
  tasksCount(where: $where)
  tasks(orderBy: $orderBy, where: $where) {
    ...officeTask
  }
}

fragment officeTask on Task {
  id
  name
  # content
  createdAt
  startDatePlaning
  endDatePlaning
  startDate
  endDate
  status
  TaskProjects {
    id
    Project: ProjectTaskProject {
      id
      name
    }
  }
  CreatedBy: CreatedByUser {
    id
    username
    fullname
    image
  }
}

