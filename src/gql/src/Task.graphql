fragment task_ on Task {
  ...TaskNoNesting
  CreatedBy: CreatedByUser {
    ...UserNoNesting
  }
  Timers(orderBy: { createdAt: desc }, where: $timersWhere) {
    ...timersConnectionTimer
  }
  # Timers(orderBy: createdAt_DESC) {
  #   ...TimerNoNesting
  #   CreatedBy: CreatedByUser {
  #     ...UserNoNesting
  #   }
  # }
  # Timers(orderBy: { createdAt: desc }, where: $timersWhere) {
  #   ...TimerNoNesting
  #   # CreatedBy: CreatedByUser {
  #   #   ...UserNoNesting
  #   # }
  #   ...Timer_
  # }
  TaskProjects {
    id
    createdAt
    updatedAt
    Project: ProjectTaskProject {
      ...ProjectNoNesting
      CreatedBy: CreatedByUser {
        ...UserNoNesting
      }
      Resource: ProjectResource {
        id
        name
        uri
      }
    }
  }
  # RelatedTo {
  #   ...TaskNoNesting
  # }
  # Reactions {
  #   ...TaskReactionNoNesting
  #   CreatedBy {
  #     ...UserNoNesting
  #   }
  # }
  Parent: ParentTask {
    id
  }
}

fragment TaskNoNesting on Task {
  id
  createdAt
  updatedAt
  name
  description
  content
  status
  startDatePlaning
  endDatePlaning
  startDate
  endDate
  needHelp
}

fragment TaskReactionNoNesting on TaskReaction {
  id
  createdAt
  updatedAt
  type
}

fragment tasksConnectionTask on Task {
  ...task_
  ...taskTaskTechnologies

