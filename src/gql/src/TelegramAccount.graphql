fragment TelegramAccountNoNesting on TelegramAccount {
  id
  createdAt
  photo_url
}

mutation authViaTelegram(
  $tgAuthData: TelegramAuthDataInput!
  $withMentorMentee: Boolean = false
  $withUserTechnologies: Boolean = false
  $withCodeChallengeCompletions: Boolean = false
  $withEducationProjects: Boolean = false
) {
  authViaTelegram(tgAuthData: $tgAuthData) {
    success
    message
    errors {
      key
      message
    }
    token
    data {
      ...meUser
    }
  }
}
