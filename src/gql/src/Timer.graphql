query timersConnection(
  $where: TimerWhereInput
  $orderBy: [TimerOrderByWithRelationInput!] = { createdAt: desc }
  $skip: Int
  # $after: String
  # $before: String
  $first: Int # $last: Int
) {
  timersCount(where: $where)

  timers(
    where: $where
    orderBy: $orderBy
    skip: $skip
    # after: $after
    # before: $before
    take: $first # last: $last
  ) {
    ...timersConnectionTimer
  }
}

mutation createTimerProcessor($data: TimerCreateInput!) {
  response: createTimerProcessor(data: $data) {
    success
    message
    errors {
      key
      message
    }
    data {
      ...TimerNoNesting
    }
  }
}

mutation updateTimerProcessor(
  $data: TimerUpdateInput!
  $where: TimerWhereUniqueInput!
) {
  response: updateTimerProcessor(data: $data, where: $where) {
    success
    message
    errors {
      key
      message
    }
    data {
      ...TimerNoNesting
    }
  }
}

