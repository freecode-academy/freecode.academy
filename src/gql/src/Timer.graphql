fragment Timer_ on Timer {
  ...TimerNoNesting

  CreatedBy: CreatedByUser {
    ...UserNoNesting
  }
  Task: TimerTask {
    ...TaskNoNesting
    TaskProjects {
      id
      createdAt
      updatedAt
      Project: ProjectTaskProject {
        ...ProjectNoNesting
        CreatedBy: CreatedByUser {
          ...UserNoNesting
        }
        Resource: ProjectResource {
          id
          name
          uri
        }
      }
    }
    # RelatedTo {
    #   ...TaskNoNesting
    # }
    # Reactions {
    #   ...TaskReactionNoNesting
    #   CreatedBy {
    #     ...UserNoNesting
    #   }
    # }
  }
}

fragment TimerNoNesting on Timer {
  id
  createdAt
  updatedAt
  stopedAt
}

fragment timersConnectionTimer on Timer {
  ...Timer_
}
