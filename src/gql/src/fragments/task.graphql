fragment task_ on Task {
  ...TaskNoNesting
  CreatedBy {
    ...UserNoNesting
  }
  # Timers(orderBy: createdAt_DESC) {
  #   ...TimerNoNesting
  #   CreatedBy {
  #     ...UserNoNesting
  #   }
  # }
  Timers(orderBy: { createdAt: desc }, where: $timersWhere) {
    ...TimerNoNesting
    CreatedBy: TimerCreatedBy {
      ...UserNoNesting
    }
    ...Timer_
  }
  TaskProjects {
    id
    createdAt
    updatedAt
    Project {
      ...ProjectNoNesting
      CreatedBy {
        ...UserNoNesting
      }
      Resource {
        id
        name
        uri
      }
    }
  }
  # RelatedTo {
  #   ...TaskNoNesting
  # }
  # Reactions {
  #   ...TaskReactionNoNesting
  #   CreatedBy {
  #     ...UserNoNesting
  #   }
  # }
  Parent {
    id
  }
}

fragment TaskNoNesting on Task {
  id
  createdAt
  updatedAt
  name
  description
  content
  status
  startDatePlaning
  endDatePlaning
  startDate
  endDate
  needHelp
}

fragment TaskReactionNoNesting on TaskReaction {
  id
  createdAt
  updatedAt
  type
}

fragment tasksConnectionTask on Task {
  ...task_
  ...taskTaskTechnologies
}

fragment taskTaskTechnologies on Task {
  ...TaskNoNesting
  CreatedBy {
    ...UserNoNesting
  }
  TaskTechnologies {
    ...taskTaskTechnology_
  }
}

fragment taskTaskTechnology_ on TaskTechnology {
  id
  level
  Technology {
    ...TechnologyNoNesting
  }
}
